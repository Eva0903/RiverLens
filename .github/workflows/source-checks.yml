name: Source checks without research data
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit public file list
        run: python scripts/audit_public_release.py
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Test using artificial data only
        run: python -m unittest discover -s tests -v
      - name: Check experiment selection
        run: python run_study.py --experiment 07 --mode run --dry-run
